[project]
name = "gpedc-monitoring-mapping"
version = "0.1.0"
description = "Mapping where IATI Standard v2.03 publications can supplement means of verification for the GPEDC Monitoring Framework."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dash>=4.1.0",
    "dash-bootstrap-components>=2.0.4",
    "gunicorn>=25.3.0",
    "lxml>=6.1.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "plotly[express]>=6.7.0",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpedc_iati"]

[dependency-groups]
# Dev tooling — lint, format, test, docs build, pre-commit hooks, plus the
# Jupyter stack used by `scripts/run_notebooks.py` for the offline data-prep
# step. These are NOT runtime deps for the Dash app — keeping them out of
# the runtime export keeps the production image small and the pip-audit
# scope tight.
dev = [
    "furo>=2025.12.19",
    "jupyter>=1.1.1",
    "myst-parser>=5.0.0",
    "notebook>=7.5.6",
    "pre-commit>=4.0.1",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
    "sphinx>=9.1.0",
    "sphinx-design>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    ".tmp",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".ipynb_checkpoints",
    "docs/_build",
    "notebooks",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line-too-long (handled by formatter; long strings in this repo are fine)
]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
